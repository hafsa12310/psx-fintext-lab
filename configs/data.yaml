psx:
  request_url: "https://dps.psx.com.pk/announcements"   # check the Headers tab
  method: "POST"
  headers:
    Accept: "text/html, */*; q=0.01"
    Accept-Language: "en-US,en;q=0.9"
    Origin: "https://dps.psx.com.pk"
    Referer: "https://dps.psx.com.pk/announcements"
    X-Requested-With: "XMLHttpRequest"
  form:
    type: "C"          # the company-announcements code from Payload
    symbol: ""
    query: ""
    count: 50
    page: "annc"
  date_from_field: "date_from"
  date_to_field: "date_to"
  date_format: "%Y-%m-%d"
  page_field: "offset"
  page_start: 0
  page_step: 50
  max_pages: 100

  column_map:
    name: company

  start_month: "2026-05"
  end_month: "2026-10"
  delay_seconds: 1.5
  pdf_base_url: "https://dps.psx.com.pk"
  pdf_excerpt_chars: 1500

news:
  feeds:
    - name: dawn_business
      url: "https://www.dawn.com/feeds/business"
